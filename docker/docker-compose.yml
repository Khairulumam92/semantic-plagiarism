version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: plagiarisme-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ../assets:/app/assets
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - webnet

  nginx:
    image: nginx:alpine
    container_name: plagiarisme-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
